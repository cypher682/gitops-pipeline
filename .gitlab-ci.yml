# gitops-pipeline — GitLab CI
# Stage flow: validate -> build -> test -> scan -> sign -> push -> deploy-dev -> promote -> deploy-staging
#
# STATUS: validate/build/test are real (Stage 5). scan/sign/push/deploy still
# being filled in Stages 6-9 — see README.md for current status per stage.

stages:
  - validate
  - build
  - test
  - scan
  - sign
  - push
  - deploy-dev
  - promote
  - deploy-staging

variables:
  IMAGE_NAME: "gitops-pipeline-app"
  # Git SHA used as immutable image tag throughout the pipeline
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  REGISTRY: "${CI_REGISTRY_IMAGE}"
  COVERAGE_THRESHOLD: "70"

default:
  interruptible: true

# ---------------------------------------------------------------------------
# validate
# ---------------------------------------------------------------------------
lint:app:
  stage: validate
  image: python:3.13-slim
  script:
    - pip install --no-cache-dir --quiet -r app/requirements-dev.txt
    - cd app && ruff check .

lint:dockerfile:
  stage: validate
  image: hadolint/hadolint:2.12.0-alpine
  script:
    - hadolint --ignore DL3013 app/Dockerfile

lint:k8s-manifests:
  stage: validate
  image:
    name: alpine/helm:3.15.4
    entrypoint: [""]
  before_script:
    - apk add --no-cache curl
    - curl -sL https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeval
  script:
    - helm template helm/app-chart --values helm/app-chart/values-dev.yaml > /tmp/rendered-dev.yaml
    - helm template helm/app-chart --values helm/app-chart/values-staging.yaml > /tmp/rendered-staging.yaml
    # kubeval doesn't know the Rollout CRD schema — skip-kinds avoids false failures
    # on argoproj.io/v1alpha1 while still validating every core K8s resource.
    # --ignore-missing-schemas: GitLab runners often can't fetch schemas for newer K8s kinds (HPA v2, Ingress v1)
    # WARNs would otherwise exit 1 — we still validate what has a schema.
    - kubeval --ignore-missing-schemas --skip-kinds Rollout,AnalysisTemplate /tmp/rendered-dev.yaml /tmp/rendered-staging.yaml

lint:terraform:
  stage: validate
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  rules:
    - changes:
        - "**/*.tf"
  script:
    - terraform fmt -check -recursive
    - terraform validate

# ---------------------------------------------------------------------------
# build
# ---------------------------------------------------------------------------
build:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build
      --cache-from "${REGISTRY}/${IMAGE_NAME}:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      -t "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
      -f app/Dockerfile app/
    - docker push "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
  # image is re-pulled by later stages via IMAGE_TAG rather than passed as
  # an artifact — keeps the job fast and avoids duplicating layers on disk

# ---------------------------------------------------------------------------
# test
# ---------------------------------------------------------------------------
test:unit:
  stage: test
  image: python:3.13-slim
  script:
    - pip install --no-cache-dir --quiet -r app/requirements-dev.txt
    - cd app && python -m pytest -v --cov=app --cov-report=xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: app/coverage.xml
    paths:
      - app/coverage.xml
    expire_in: 1 week

test:integration:
  stage: test
  image: python:3.13-slim
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: gitops_test
    POSTGRES_USER: gitops
    POSTGRES_PASSWORD: gitops
    DATABASE_URL: "postgresql://gitops:gitops@postgres:5432/gitops_test"
    REDIS_URL: "redis://redis:6379/0"
  script:
    - pip install --no-cache-dir --quiet -r app/requirements-dev.txt
    # Placeholder — the sample app is intentionally in-memory (no real DB/
    # cache dependency yet), so this currently just proves service
    # containers wire up correctly. Swap in real integration tests here
    # if/when the app grows a Postgres/Redis-backed feature.
    - python -c "import os; print('DB reachable at', os.environ['DATABASE_URL'])"

test:coverage-gate:
  stage: test
  image: python:3.13-slim
  needs:
    - job: test:unit
      artifacts: true
  script:
    - |
      COVERAGE=$(python -c "
      import xml.etree.ElementTree as ET
      root = ET.parse('app/coverage.xml').getroot()
      print(round(float(root.attrib['line-rate']) * 100))
      ")
      echo "Coverage: ${COVERAGE}% (gate: ${COVERAGE_THRESHOLD}%)"
      if [ "$COVERAGE" -lt "$COVERAGE_THRESHOLD" ]; then
        echo "FAIL: coverage ${COVERAGE}% is below ${COVERAGE_THRESHOLD}% threshold"
        exit 1
      fi

# ---------------------------------------------------------------------------
# scan
# ---------------------------------------------------------------------------
scan:trivy:
  stage: scan
  image:
    name: aquasec/trivy:0.55.2
    entrypoint: [""]
  needs: ["build:image"]
  script:
    - trivy image
      --exit-code 1
      --severity CRITICAL
      --format table
      --ignore-unfixed
      "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
  after_script:
    # Always produce a full report artifact even when the job fails the gate above,
    # so the CRITICAL finding is visible without re-running.
    - trivy image --format json --output trivy-report.json "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" || true
  artifacts:
    paths:
      - trivy-report.json
    when: always
    expire_in: 2 weeks

scan:semgrep:
  stage: scan
  image: semgrep/semgrep:1.86.0
  script:
    - semgrep scan
      --config auto
      --config .semgrep.yml
      --error
      --json --output semgrep-report.json
      app/
  artifacts:
    paths:
      - semgrep-report.json
    when: always
    expire_in: 2 weeks

scan:sops-detect:
  stage: scan
  image: python:3.13-slim
  script:
    - |
      # Fails the pipeline if anything under secrets/ looks like plaintext
      # rather than SOPS-encrypted (SOPS-encrypted files always contain
      # a top-level "sops:" metadata key).
      set -e
      FOUND_PLAINTEXT=0
      for f in $(find secrets/ -type f \( -name "*.yaml" -o -name "*.yml" -o -name "*.json" \) 2>/dev/null); do
        if ! grep -q "sops:" "$f"; then
          echo "UNENCRYPTED SECRET FILE: $f"
          FOUND_PLAINTEXT=1
        fi
      done
      if [ "$FOUND_PLAINTEXT" -eq 1 ]; then
        echo "FAIL: plaintext secret file(s) detected in secrets/"
        exit 1
      fi
      echo "OK: no plaintext secrets found under secrets/"

scan:dependency-audit:
  stage: scan
  image: python:3.13-slim
  script:
    - pip install --no-cache-dir --quiet pip-audit
    - pip-audit -r app/requirements.txt

# ---------------------------------------------------------------------------
# sign
# ---------------------------------------------------------------------------
sign:cosign:
  stage: sign
  image: alpine:3.20
  needs: ["scan:trivy", "scan:semgrep"]
  variables:
    COSIGN_EXPERIMENTAL: "1"  # enables keyless (Sigstore/Fulcio/Rekor) signing
  before_script:
    - apk add --no-cache curl
    - curl -sL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
    - chmod +x /usr/local/bin/cosign
  script:
    # Keyless: identity comes from the GitLab CI OIDC token, no key
    # management required. Requires the project's CI/CD OIDC issuer to be
    # trusted by Fulcio, which is the public default — no extra config needed
    # for gitlab.com-hosted projects.
    - cosign sign --yes "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

sign:sbom:
  stage: sign
  image: alpine:3.20
  needs: ["build:image"]
  before_script:
    - apk add --no-cache curl
    - curl -sL https://github.com/anchore/syft/releases/download/v1.14.1/syft_1.14.1_linux_amd64.tar.gz | tar xz -C /usr/local/bin syft
  script:
    - syft "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" -o cyclonedx-json=sbom.cyclonedx.json
  artifacts:
    paths:
      - sbom.cyclonedx.json
    expire_in: 6 months

sign:sbom-attest:
  stage: sign
  image: alpine:3.20
  needs: ["sign:sbom", "sign:cosign"]
  variables:
    COSIGN_EXPERIMENTAL: "1"
  before_script:
    - apk add --no-cache curl
    - curl -sL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
    - chmod +x /usr/local/bin/cosign
  script:
    - cosign attest --yes
      --predicate sbom.cyclonedx.json
      --type cyclonedx
      "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

# ---------------------------------------------------------------------------
# push
# ---------------------------------------------------------------------------
# NOTE: the actual `docker push` of the image happens in build:image so the
# signing jobs above have something in the registry to sign. This stage
# handles what "push" really means for GitOps: promoting the tag into the
# values file that ArgoCD watches.
push:tag-latest:
  stage: push
  image: docker:27
  services:
    - docker:27-dind
  needs: ["sign:cosign", "sign:sbom-attest"]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Re-tag the verified/signed SHA-tagged image as :latest for convenience
    - docker pull "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
    - docker tag "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" "${REGISTRY}/${IMAGE_NAME}:latest"
    - docker push "${REGISTRY}/${IMAGE_NAME}:latest"

push:update-gitops-values:
  stage: push
  image: alpine/git:2.45.2
  needs: ["push:tag-latest"]
  script:
    - |
      git config user.email "ci-bot@gitops-pipeline"
      git config user.name "gitops-pipeline CI"
      git checkout main
      sed -i "s/tag: .*/tag: \"${IMAGE_TAG}\"/" helm/app-chart/values-dev.yaml 2>/dev/null || true
      sed -i "s/tag: .*/tag: \"${IMAGE_TAG}\"/" helm/app-chart/values.yaml
      git add helm/app-chart/values.yaml
      git commit -m "ci: bump image tag to ${IMAGE_TAG} [skip ci]" || echo "nothing to commit"
      git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:main

# ---------------------------------------------------------------------------
# deploy-dev
# ---------------------------------------------------------------------------
deploy:dev-sync:
  stage: deploy-dev
  image: argoproj/argocd:v2.13.0
  needs: ["push:update-gitops-values"]
  script:
    - argocd login "${ARGOCD_SERVER}" --auth-token "${ARGOCD_AUTH_TOKEN}" --grpc-web
    # Dev is auto-sync + self-heal (see argocd/applicationset.yaml), so this
    # call just forces an immediate sync rather than waiting for ArgoCD's
    # poll interval — keeps CI feedback fast.
    - argocd app sync gitops-pipeline-dev --grpc-web
    - argocd app wait gitops-pipeline-dev --health --timeout 180 --grpc-web

deploy:dev-smoke-test:
  stage: deploy-dev
  image: curlimages/curl:8.10.1
  needs: ["deploy:dev-sync"]
  script:
    - curl -sf --retry 5 --retry-delay 5 "${DEV_APP_URL}/health"

# ---------------------------------------------------------------------------
# promote
# ---------------------------------------------------------------------------
promote:manual-gate:
  stage: promote
  when: manual
  needs: ["deploy:dev-smoke-test"]
  environment:
    name: staging
    action: prepare
  script:
    - echo "Manual approval recorded via GitLab protected environment. Proceeding to signature verification."

promote:verify-signature:
  stage: promote
  image: alpine:3.20
  needs: ["promote:manual-gate"]
  variables:
    COSIGN_EXPERIMENTAL: "1"
  before_script:
    - apk add --no-cache curl
    - curl -sL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
    - chmod +x /usr/local/bin/cosign
  script:
    # Re-verifies the signature right before staging deployment — belt and
    # suspenders in case the tag moved or was re-pushed between build and
    # promotion.
    - cosign verify
      --certificate-identity-regexp ".*"
      --certificate-oidc-issuer "https://gitlab.com"
      "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

# ---------------------------------------------------------------------------
# deploy-staging
# ---------------------------------------------------------------------------
deploy:staging-sync:
  stage: deploy-staging
  image: argoproj/argocd:v2.13.0
  needs: ["promote:verify-signature"]
  script:
    - argocd login "${ARGOCD_SERVER}" --auth-token "${ARGOCD_AUTH_TOKEN}" --grpc-web
    # Staging has no automated sync policy (manual only) — this is the
    # explicit trigger, gated on human approval + signature re-verification
    # above.
    - argocd app sync gitops-pipeline-staging --grpc-web

deploy:staging-canary:
  stage: deploy-staging
  image: argoproj/argocd:v2.13.0
  needs: ["deploy:staging-sync"]
  script:
    # Watches the Rollout's own canary progression (10% -> analysis -> 50%
    # -> analysis -> 100%, defined in helm/app-chart/templates/rollout.yaml
    # and rollouts/analysis-template.yaml). Auto-rollback on failed analysis
    # is handled by the Rollouts controller itself, not this job.
    - argocd login "${ARGOCD_SERVER}" --auth-token "${ARGOCD_AUTH_TOKEN}" --grpc-web
    - argocd app wait gitops-pipeline-staging --health --timeout 600 --grpc-web
