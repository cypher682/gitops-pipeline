environment: dev
replicaCount: 1
ingress:
  host: gitops-app-dev.local
hpa:
  minReplicas: 1
  maxReplicas: 3
rollout:
  # Dev auto-syncs and doesn't need the full canary ceremony —
  # single-step rollout keeps iteration fast.
  enabled: true
  analysisTemplate: false
  canarySteps:
    - setWeight: 100
