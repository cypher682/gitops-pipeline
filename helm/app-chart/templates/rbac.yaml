{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app-chart.serviceAccountName" . }}
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "app-chart.fullname" . }}
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
rules:
  # Minimal permissions: the app itself needs none beyond reading its own
  # ConfigMaps/Secrets if added later. Kept least-privilege on purpose.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "app-chart.fullname" . }}
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "app-chart.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "app-chart.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
