# ApplicationSet generates one ArgoCD Application per environment from a
# single template, driven by the `list` generator below.
#
# Apply with: kubectl apply -f argocd/applicationset.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-pipeline-app
  namespace: argocd
spec:
  # goTemplate enables the {{- if }} conditional below so dev and staging
  # can have genuinely different sync policies from one template.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
            namespace: gitops-dev
            valuesFile: values-dev.yaml
          - env: staging
            namespace: gitops-staging
            valuesFile: values-staging.yaml
            # Manual sync — triggered only by the CI `promote` stage after the
            # human approval gate and Cosign signature verification pass.
  template:
    metadata:
      name: "gitops-pipeline-{{.env}}"
      labels:
        environment: "{{.env}}"
    spec:
      project: default
      source:
        # Replace with your actual GitLab (or GitHub mirror) repo URL.
        repoURL: https://gitlab.com/cypher682/gitops-pipeline.git
        targetRevision: main
        # Path "." = the whole repo is the CMP's working dir. The sops-helm
        # plugin renders ./helm/app-chart and appends decrypted ./secrets/*.
        path: "."
        # Managed by the sops-helm ConfigManagementPlugin sidecar (renders the
        # chart then appends SOPS-decrypted manifests). Auto-selected via the
        # plugin's Chart.yaml discovery — no explicit name needed.
        plugin:
          env:
            # Read by the CMP as $ARGOCD_ENV_VALUES_FILE (ArgoCD prefixes
            # plugin env vars with ARGOCD_ENV_).
            - name: VALUES_FILE
              value: "{{.valuesFile}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      # Both environments sync on demand — dev is triggered automatically by
      # the deploy:dev-sync CI job, staging only by the promote gate
      # (deploy:staging-sync). Keeps this manifest valid YAML (a go-template
      # if/end block around a mapping would break the plain-YAML parse the
      # repo-server does when the root app applies it via app-of-apps).
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
---
# Namespaces created up front so NetworkPolicy namespaceSelectors
# (ingress-nginx, observability) resolve correctly even before first sync.
apiVersion: v1
kind: Namespace
metadata:
  name: gitops-dev
  labels:
    kubernetes.io/metadata.name: gitops-dev
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitops-staging
  labels:
    kubernetes.io/metadata.name: gitops-staging
