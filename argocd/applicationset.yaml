# ApplicationSet generates one ArgoCD Application per environment from a
# single template, driven by the `list` generator below.
#
# Apply with: kubectl apply -f argocd/applicationset.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-pipeline-app
  namespace: argocd
spec:
  # goTemplate enables the {{- if }} conditional below so dev and staging
  # can have genuinely different sync policies from one template.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
            namespace: gitops-dev
            valuesFile: values-dev.yaml
            autoSync: true
          - env: staging
            namespace: gitops-staging
            valuesFile: values-staging.yaml
            # Manual sync — only triggered after the CI `promote` stage
            # approval gate and signature verification pass.
            autoSync: false
  template:
    metadata:
      name: "gitops-pipeline-{{.env}}"
      labels:
        environment: "{{.env}}"
      annotations:
        # Tells argocd-repo-server (ARGOCD_REPO_SERVER_PLUGIN_USE_MANIFEST_GENERATE_PATHS=true)
        # to include the secrets/ directory in the tar stream handed to the
        # sops-helm CMP so ../secrets/*.enc.yaml resolves during generate.
        argocd.argoproj.io/manifest-generate-paths: "helm/app-chart,secrets"
    spec:
      project: default
      source:
        # Replace with your actual GitLab (or GitHub mirror) repo URL.
        repoURL: https://gitlab.com/cypher682/gitops-pipeline.git
        targetRevision: main
        path: helm/app-chart
        # Managed by the sops-helm ConfigManagementPlugin sidecar (renders the
        # chart then appends SOPS-decrypted manifests). Auto-selected via the
        # plugin's Chart.yaml discovery — no explicit name needed.
        plugin:
          env:
            # Read by the CMP as $ARGOCD_ENV_VALUES_FILE (ArgoCD prefixes
            # plugin env vars with ARGOCD_ENV_).
            - name: VALUES_FILE
              value: "{{.valuesFile}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        {{- if .autoSync }}
        automated:
          prune: true
          selfHeal: true
        {{- end }}
        syncOptions:
          - CreateNamespace=true
---
# Namespaces created up front so NetworkPolicy namespaceSelectors
# (ingress-nginx, observability) resolve correctly even before first sync.
apiVersion: v1
kind: Namespace
metadata:
  name: gitops-dev
  labels:
    kubernetes.io/metadata.name: gitops-dev
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitops-staging
  labels:
    kubernetes.io/metadata.name: gitops-staging
