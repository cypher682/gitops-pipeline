# ArgoCD ConfigManagementPlugin that renders the Helm chart AND decrypts
# SOPS-encrypted files from secrets/ at sync time. Runs as a sidecar to
# argocd-repo-server (ArgoCD v3 sidecar CMP architecture).
#
# Applied in two steps, then the repo-server wires the sidecar in:
#   1. kubectl apply -f argocd/sops-plugin.yaml -n argocd
#   2. kubectl create secret generic sops-age-key -n argocd \
#        --from-file=age-key.txt=<path-to-your-age-key.txt>
#   3. kubectl patch deployment argocd-repo-server -n argocd \
#        --patch-file argocd/sops-plugin-patch.yaml
#   4. kubectl rollout restart deployment argocd-repo-server -n argocd
#
# Notes:
#   - The sidecar's SOPS_AGE_KEY env var holds the age PRIVATE key from the
#     sops-age-key secret (ArgoCD mounts it as the value of key `age-key.txt`).
#   - The plugin is auto-selected by ArgoCD for any Application repo containing
#     a Chart.yaml (discover), so the Applications use `spec.source.plugin`
#     with no explicit name (see argocd/applicationset.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sops-cmp-plugin
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: sops-helm
    spec:
      discover:
        find:
          command: [sh, -c, "find . -name 'Chart.yaml'"]
      init:
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            helm dependency build ./helm/app-chart || true
      generate:
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -o pipefail
            # The ApplicationSet points the app source at the repo ROOT
            # (path: "."), so cwd = repo root: the chart lives at
            # ./helm/app-chart and the SOPS files at ./secrets — both are
            # inside the tar stream the repo-server sends to this plugin
            # (sibling ../paths would NOT be included).
            # $ARGOCD_ENV_VALUES_FILE is injected from the Application's
            # plugin.env (values-dev.yaml / values-staging.yaml).
            helm template ./helm/app-chart -f "./helm/app-chart/${ARGOCD_ENV_VALUES_FILE:-values.yaml}"
            for f in ./secrets/*.enc.yaml; do
              [ -f "$f" ] || continue
              echo "---"
              sops --decrypt "$f"
            done